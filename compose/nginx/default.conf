server {
    listen 443 ssl;
    server_name requests.neldridge.net;

    ssl_certificate /etc/nginx/certs/requests/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/requests/privkey.pem;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $requests_backend http://seerr:5055;

    location / {
        proxy_pass $requests_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 3579;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}
