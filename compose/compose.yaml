name: homelab
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls329@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc
    restart: on-failure
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "8989:8989"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: bind
        source: "${CONFIG_ROOT}/sonarr"
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${DOWNLOAD_ROOT}"
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/TV Shows"
        target: /tv
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/Movies"
        target: /movies
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/Books"
        target: /books
        bind:
          create_host_path: false
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls323@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1
