    restart: on-failure
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "8989:8989"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: bind
        source: "${CONFIG_ROOT}/sonarr"
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${DOWNLOAD_ROOT}"
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/TV Shows"
