        max-file: "3"
    volumes:
      - type: bind
        source: "${CONFIG_ROOT}/bazarr"
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/TV Shows"
        target: /tv
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/Movies"
