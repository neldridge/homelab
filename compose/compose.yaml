name: homelab
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls327@sha256:dffc730adcb8b4f4342792fbb27fcad9c62fb8660523f2aeb082416980d7fe0c
    restart: on-failure
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    ports:
      - "8989:8989"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: bind
        source: "${CONFIG_ROOT}/sonarr"
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: "${DOWNLOAD_ROOT}"
        target: /downloads
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/TV Shows"
        target: /tv
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/Movies"
        target: /movies
        bind:
          create_host_path: false
      - type: bind
        source: "${LIBRARY_ROOT}/Books"
        target: /books
        bind:
          create_host_path: false
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls320@sha256:cfbc4fa09dc9d78f7cedc898f4ec48c6277cacedc523c4e159db6ff1c741959c
