    restart: on-failure
    init: true
    environment:
      TZ: ${TZ}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1"]
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    ports:
      - "5055:5055"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - type: bind
        source: "${CONFIG_ROOT}/seerr"
        target: /app/config
        bind:
          create_host_path: false
  nzbget:
