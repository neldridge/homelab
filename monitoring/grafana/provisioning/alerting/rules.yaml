              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 120,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "(homelab_wanted_ok == bool 0) + (time() - homelab_wanted_timestamp > bool 900) or absent(homelab_wanted_ok{service=\"sonarr\"}) or absent(homelab_wanted_ok{service=\"radarr\"})",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
