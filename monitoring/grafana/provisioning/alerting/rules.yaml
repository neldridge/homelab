{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "R710 baseline",
      "folder": "Homelab",
      "interval": "30s",
      "rules": [
        {
          "uid": "host-missing",
          "title": "HostMetricsMissing",
          "condition": "B",
          "for": "30s",
          "noDataState": "NoData",
          "execErrState": "Error",
          "isPaused": false,
          "labels": {
            "host": "bb9b",
            "scope": "workload"
          },
          "annotations": {
            "summary": "R710 host metrics missing or stale",
            "description": "Inspect the Homelab overview. Endpoint health and logs are not covered in phase 1.",
            "__dashboardUid__": "homelab-overview",
            "__panelId__": "1"
          },
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 120,
                "to": 0
              },
              "model": {
                "refId": "A",
                "expr": "absent(up{job=\"r710-host\"}) or absent(node_time_seconds{job=\"r710-host\"}) or ((up{job=\"r710-host\"} == bool 0) + (time() - timestamp(node_time_seconds{job=\"r710-host\"}) > bool 60))",
                "instant": true,
                "range": false,
                "intervalMs": 15000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "refId": "B",
                "type": "threshold",
                "expression": "A",
                "conditions": [
                  {
                    "evaluator": {
                      "type": "gt",
                      "params": [
                        0.5
                      ]
                    },
                    "operator": {
                      "type": "and"
                    },
                    "reducer": {
                      "type": "last",
                      "params": []
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ]
        },
        {
          "uid": "prometheus-stale",
          "title": "PrometheusSelfScrapeStale",
