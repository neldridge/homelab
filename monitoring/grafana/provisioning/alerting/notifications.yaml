{
  "apiVersion": 1,
  "contactPoints": [
    {
      "orgId": 1,
      "name": "PagerDuty",
      "receivers": [
        {
          "uid": "pagerduty",
          "type": "pagerduty",
          "disableResolveMessage": false,
          "settings": {
            "integrationKey": "$PAGERDUTY_ROUTING_KEY",
            "severity": "critical",
            "component": "Grafana",
            "group": "homelab",
            "summary": "{{ .Status | toUpper }}: {{ .CommonLabels.alertname }} on {{ .CommonLabels.host }}"
          }
        }
      ]
    },
    {
      "orgId": 1,
      "name": "Pushover",
      "receivers": [
        {
          "uid": "pushover",
          "type": "pushover",
          "disableResolveMessage": false,
          "settings": {
            "apiToken": "$PUSHOVER_APP_TOKEN",
            "userKey": "$PUSHOVER_USER_KEY",
            "priority": "1",
            "okPriority": "0",
            "message": "{{ .Status | toUpper }} \u2014 R710 (bb9b)\n{{ range .Alerts }}{{ if eq .Labels.alertname \"DatasourceError\" }}Query failed: {{ .Labels.rulename }}{{ else if eq .Labels.alertname \"DatasourceNoData\" }}No query data: {{ .Labels.rulename }}{{ else }}{{ .Annotations.summary }} {{ .Labels.mountpoint }}{{ end }}\nDuration: {{ if eq .Status \"resolved\" }}{{ .EndsAt.Sub .StartsAt }}{{ else }}{{ (time.Now).Sub .StartsAt }}{{ end }}\n{{ end }}Overview: https://grafana.neldridge.net:3000/d/homelab-overview",
            "url": "https://grafana.neldridge.net:3000/d/homelab-overview",
            "urlTitle": "Homelab overview"
          }
        }
      ]
    },
    {
      "orgId": 1,
      "name": "Healthchecks heartbeat",
      "receivers": [
        {
          "uid": "healthchecks",
          "type": "webhook",
          "disableResolveMessage": true,
          "settings": {
            "url": "$HEALTHCHECKS_PING_URL",
            "httpMethod": "POST",
            "maxAlerts": "1"
          }
        }
      ]
    },
    {
      "orgId": 1,
      "name": "Log Healthchecks heartbeat",
      "receivers": [
        {
          "uid": "log-healthchecks",
          "type": "webhook",
          "disableResolveMessage": true,
          "settings": {
            "url": "$LOG_HEALTHCHECKS_PING_URL",
            "httpMethod": "POST",
            "maxAlerts": "1"
          }
        }
      ]
    },
    {
      "orgId": 1,
      "name": "Maintenance PagerDuty",
      "receivers": [
        {
          "uid": "maintenance-pagerduty",
          "type": "pagerduty",
          "disableResolveMessage": false,
          "settings": {
            "integrationKey": "$PAGERDUTY_ROUTING_KEY",
            "severity": "info",
            "component": "Grafana",
            "group": "homelab",
            "summary": "{{ .Status | toUpper }}: maintenance {{ .CommonLabels.alertname }} on {{ .CommonLabels.host }} \u2014 review overview versions"
          }
        }
      ]
    }
  ],
  "policies": [
    {
      "orgId": 1,
      "receiver": "PagerDuty",
      "group_by": [
        "grafana_folder",
        "host",
        "alertname"
      ],
      "group_wait": "10s",
      "group_interval": "30s",
      "repeat_interval": "4h",
      "routes": [
        {
          "receiver": "PagerDuty",
          "object_matchers": [
            [
              "alertname",
              "=~",
              "DatasourceError|DatasourceNoData"
            ]
          ]
        },
        {
          "receiver": "Maintenance PagerDuty",
          "object_matchers": [
            [
              "scope",
              "=",
              "maintenance"
            ]
          ],
          "group_by": [
            "alertname",
            "host"
          ],
          "group_wait": "10s",
          "group_interval": "30s",
          "repeat_interval": "7d"
        },
        {
          "receiver": "Healthchecks heartbeat",
          "object_matchers": [
            [
              "alertname",
              "=",
              "MonitoringHeartbeat"
            ],
            [
              "scope",
              "=",
              "heartbeat"
            ]
          ],
          "group_by": [
            "alertname"
          ],
          "group_wait": "5s",
          "group_interval": "30s",
          "repeat_interval": "60s"
        },
        {
          "receiver": "Log Healthchecks heartbeat",
          "object_matchers": [
            [
              "alertname",
              "=",
              "LogPipelineHeartbeat"
            ],
            [
              "scope",
              "=",
              "log-heartbeat"
            ]
          ],
          "group_by": [
            "alertname"
          ],
          "group_wait": "5s",
          "group_interval": "30s",
          "repeat_interval": "60s"
        }
      ]
    }
  ]
}
