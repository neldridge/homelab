global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    host: bb9b
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          host: bb9b
  - job_name: alloy
    static_configs:
      - targets: ['alloy:12345']
        labels:
          host: bb9b
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']
        labels: {host: bb9b}
  - job_name: exportarr-sonarr
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ['exportarr-sonarr:9707']
        labels: {host: bb9b, service: sonarr}
  - job_name: exportarr-radarr
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ['exportarr-radarr:9707']
        labels: {host: bb9b, service: radarr}
  - job_name: exportarr-prowlarr
    scrape_interval: 30s
    scrape_timeout: 20s
    static_configs:
      - targets: ['exportarr-prowlarr:9707']
        labels: {host: bb9b, service: prowlarr}
  - job_name: exportarr-bazarr
    scrape_interval: 60s
    scrape_timeout: 50s
    static_configs:
      - targets: ['exportarr-bazarr:9707']
        labels: {host: bb9b, service: bazarr}
  - job_name: dependency-grafana-internal
    scrape_interval: 30s
    scrape_timeout: 7s
    metrics_path: /probe
    params:
      module: [grafana]
    static_configs:
      - targets: ['https://grafana.a3f.link:3000/api/health']
        labels: {host: bb9b, service: grafana-internal, check: https}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: dependency-grafana-public
    scrape_interval: 30s
    scrape_timeout: 7s
    metrics_path: /probe
