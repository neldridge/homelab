    metrics_path: /snmp
    params:
      auth: [synology_v3]
      module: [synology]
    static_configs:
      - targets: ['192.168.11.131']
        labels: {host: pelican, service: synology}
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: snmp:9116
    metric_relabel_configs:
      - source_labels: [__name__, hrStorageDescr]
        regex: 'hrStorage.*;(/volume2/.+|/dev/.+|/run|/sys/.+|/tmp.*)'
        action: drop
